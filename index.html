<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Calculator</title>
    <link rel="stylesheet" href="./styles.css" />
    <link rel="icon" href="data:," />
  </head>
  <body>
    <main class="app-shell">
      <section class="calculator" role="application" aria-label="Calculator">
        <div class="output" aria-live="polite" aria-atomic="true">
          <div id="previous-operand" class="previous-operand" aria-hidden="true"></div>
          <div id="current-operand" class="current-operand">0</div>
        </div>

        <button class="btn function" data-action="clear" aria-label="All clear">AC</button>
        <button class="btn function" data-action="delete" aria-label="Delete last">DEL</button>
        <button class="btn function" data-action="percent" aria-label="Percent">%</button>
        <button class="btn operator" data-action="operator" data-value="/" aria-label="Divide">÷</button>

        <button class="btn" data-action="digit" data-value="7">7</button>
        <button class="btn" data-action="digit" data-value="8">8</button>
        <button class="btn" data-action="digit" data-value="9">9</button>
        <button class="btn operator" data-action="operator" data-value="*" aria-label="Multiply">×</button>

        <button class="btn" data-action="digit" data-value="4">4</button>
        <button class="btn" data-action="digit" data-value="5">5</button>
        <button class="btn" data-action="digit" data-value="6">6</button>
        <button class="btn operator" data-action="operator" data-value="-" aria-label="Subtract">−</button>

        <button class="btn" data-action="digit" data-value="1">1</button>
        <button class="btn" data-action="digit" data-value="2">2</button>
        <button class="btn" data-action="digit" data-value="3">3</button>
        <button class="btn operator" data-action="operator" data-value="+" aria-label="Add">+</button>

        <button class="btn function" data-action="sign" aria-label="Toggle sign">±</button>
        <button class="btn" data-action="digit" data-value="0">0</button>
        <button class="btn" data-action="digit" data-value=".">.</button>
        <button class="btn equal" data-action="equals" aria-label="Equals">=</button>
      </section>

      <footer class="hint">
        <p>
          Keyboard: 0-9, ., + - * /, Enter, =, Backspace (DEL), Esc (AC), %,
          F9 (±)
        </p>
      </footer>
    </main>
    <script defer src="./main.js"></script>
  </body>
</html>
